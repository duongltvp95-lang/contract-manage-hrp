name: CI

# Wave 1 — plan sections 85, 96, 108.
#
# Live tests require dedicated TEST_* secrets and a backend marker.
# Forks run quality + isolated Docker database checks; they explicitly skip live jobs.
#
# NOTE: `secrets` is NOT an allowed context in a job-level `if:` — only
# `github`, `needs`, `vars` and `inputs` are. Gating a job on a secret makes the
# entire workflow file invalid, and GitHub then reports a failed run with zero
# jobs. Live jobs use an explicit fork condition; missing test credentials on
# internal runs fail setup instead of silently passing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Next.js telemetry is noise in CI logs.
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: lint · typecheck · build · unit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production dependency security gate
        run: pnpm audit --prod --audit-level=high

      - name: Database migration and RLS regression tests
        run: pnpm test:db

      # The build needs *some* Supabase values to exist; they are never used at
      # build time, and the real ones are injected by the hosting platform.
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_placeholder
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_placeholder
          R2_ACCOUNT_ID: placeholder
          R2_ACCESS_KEY_ID: placeholder
          R2_SECRET_ACCESS_KEY: placeholder
          R2_BUCKET_NAME: placeholder
          R2_ENDPOINT: https://placeholder.r2.cloudflarestorage.com

  integration:
    name: integration (RLS · authorization · rate limit)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write the environment file from secrets
        run: |
          cat > .env.test.local <<'EOF'
          TEST_BACKEND_ISOLATED=1
          TEST_SUPABASE_URL=${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY=${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY=${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          APP_URL=http://localhost:3100
          MAX_UPLOAD_SIZE_MB=50
          TEST_R2_ACCOUNT_ID=${{ secrets.TEST_R2_ACCOUNT_ID }}
          TEST_R2_ACCESS_KEY_ID=${{ secrets.TEST_R2_ACCESS_KEY_ID }}
          TEST_R2_SECRET_ACCESS_KEY=${{ secrets.TEST_R2_SECRET_ACCESS_KEY }}
          TEST_R2_BUCKET_NAME=${{ secrets.TEST_R2_BUCKET_NAME }}
          TEST_R2_ENDPOINT=${{ secrets.TEST_R2_ENDPOINT }}
          TEST_ADMIN_EMAIL=${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD=${{ secrets.TEST_ADMIN_PASSWORD }}
          TEST_ADMIN_TOTP_SECRET=${{ secrets.TEST_ADMIN_TOTP_SECRET }}
          EOF

      - name: Integration tests
        run: pnpm test:integration

      - name: Remove the environment file
        if: always()
        run: rm -f .env.test.local

  e2e:
    name: e2e (Playwright)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [quality, integration]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Write the environment file from secrets
        run: |
          cat > .env.test.local <<'EOF'
          TEST_BACKEND_ISOLATED=1
          TEST_SUPABASE_URL=${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY=${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY=${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          APP_URL=http://localhost:3200
          MAX_UPLOAD_SIZE_MB=50
          TEST_R2_ACCOUNT_ID=${{ secrets.TEST_R2_ACCOUNT_ID }}
          TEST_R2_ACCESS_KEY_ID=${{ secrets.TEST_R2_ACCESS_KEY_ID }}
          TEST_R2_SECRET_ACCESS_KEY=${{ secrets.TEST_R2_SECRET_ACCESS_KEY }}
          TEST_R2_BUCKET_NAME=${{ secrets.TEST_R2_BUCKET_NAME }}
          TEST_R2_ENDPOINT=${{ secrets.TEST_R2_ENDPOINT }}
          TEST_ADMIN_EMAIL=${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD=${{ secrets.TEST_ADMIN_PASSWORD }}
          TEST_ADMIN_TOTP_SECRET=${{ secrets.TEST_ADMIN_TOTP_SECRET }}
          EOF

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Remove the environment file
        if: always()
        run: rm -f .env.test.local

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy-guard:
    name: deployment guard (all gates green)
    runs-on: ubuntu-latest
    needs: [quality, integration, e2e]
    if: always()
    steps:
      - name: Verify all quality gates
        run: |
          if [ "${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true }}" = "true" ]; then
            [ "${{ needs.quality.result }}" = "success" ] || exit 1
            echo "Fork: quality and isolated DB tests passed; live tests deliberately unavailable."
            exit 0
          fi
          echo "Quality: ${{ needs.quality.result }}"
          echo "Integration: ${{ needs.integration.result }}"
          echo "E2E: ${{ needs.e2e.result }}"
          if [ "${{ needs.quality.result }}" != "success" ] || \
             [ "${{ needs.integration.result }}" != "success" ] || \
             [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "::error::Một hoặc nhiều bài kiểm tra thất bại! Deployment Guard đã chặn triển khai."
            exit 1
          fi
          echo "Tất cả các cổng chất lượng (Quality Gates) đều đã vượt qua thành công."
