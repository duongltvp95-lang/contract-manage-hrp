name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: lint · typecheck · audit · build · unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          TZ: UTC
      - name: Vietnam calendar under a second server time zone
        run: pnpm exec vitest run --project unit tests/unit/business-date.test.ts tests/unit/format.test.ts tests/unit/contracts-query.test.ts
        env:
          TZ: America/Los_Angeles
      - name: Reject all reported production vulnerabilities
        run: pnpm audit --prod --audit-level=low
      - name: Build with placeholders
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_placeholder
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_placeholder
          R2_ACCOUNT_ID: placeholder
          R2_ACCESS_KEY_ID: placeholder
          R2_SECRET_ACCESS_KEY: placeholder
          R2_BUCKET_NAME: placeholder
          R2_ENDPOINT: https://placeholder.r2.cloudflarestorage.com

  deploy-guard:
    name: deployment guard (all gates green)
    runs-on: ubuntu-latest
    needs: [quality]
    if: always()
    steps:
      - name: Verify all quality gates, including fork runs
        run: |
          [ "${{ needs.quality.result }}" = "success" ] || exit 1
          echo "All quality checks passed."
