name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      promote_deployment_url:
        description: "Verified Vercel --skip-domain deployment URL (https://*.vercel.app) to promote to the live production domain after DB migration & smoke checks"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: lint · typecheck · audit · database · build · unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          TZ: UTC
      - name: Vietnam calendar under a second server time zone
        run: pnpm exec vitest run --project unit tests/unit/business-date.test.ts tests/unit/format.test.ts tests/unit/contracts-query.test.ts
        env:
          TZ: America/Los_Angeles
      - name: Reject all reported production vulnerabilities
        run: pnpm audit --prod --audit-level=low
      - run: pnpm test:db
      - name: Build with placeholders
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_placeholder
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_placeholder
          R2_ACCOUNT_ID: placeholder
          R2_ACCESS_KEY_ID: placeholder
          R2_SECRET_ACCESS_KEY: placeholder
          R2_BUCKET_NAME: placeholder
          R2_ENDPOINT: https://placeholder.r2.cloudflarestorage.com

  integration:
    name: integration (isolated Auth · RLS · storage · audit)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/start-isolated-backend
      - run: pnpm test:integration
      - name: Remove disposable backend and credentials
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then supabase stop --workdir tests/setup --no-backup; fi
          rm -f .env.test.local test-results/backend-status.json

  e2e:
    name: e2e (isolated browser workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: [quality, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: ./.github/actions/start-isolated-backend
      - run: pnpm test:e2e
      - name: Remove disposable backend and credentials
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then supabase stop --workdir tests/setup --no-backup; fi
          rm -f .env.test.local test-results/backend-status.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/playwright/
          retention-days: 7

  deploy-guard:
    name: deployment guard (all gates green)
    runs-on: ubuntu-latest
    needs: [quality, integration, e2e]
    if: always()
    steps:
      - name: Verify all quality gates, including fork runs
        run: |
          [ "${{ needs.quality.result }}" = "success" ] && \
          [ "${{ needs.integration.result }}" = "success" ] && \
          [ "${{ needs.e2e.result }}" = "success" ] || exit 1
          echo "All isolated quality gates passed."

  deploy-production:
    name: stage production release (--skip-domain)
    runs-on: ubuntu-latest
    needs: [deploy-guard]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.promote_deployment_url == '')
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    timeout-minutes: 25
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify Vercel deployment credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Missing VERCEL_TOKEN, VERCEL_ORG_ID, or VERCEL_PROJECT_ID in GitHub repository secrets."
            exit 1
          fi
      - name: Build and stage exact verified commit SHA on Vercel (--skip-domain)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          DEPLOY_URL="$(npx --yes vercel@latest deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN" | tail -n 1 | tr -d '[:space:]')"
          if [[ ! "$DEPLOY_URL" =~ ^https://[a-z0-9-]+\.vercel\.app$ ]]; then
            echo "::error::Unexpected Vercel deployment URL output: $DEPLOY_URL"
            exit 1
          fi
          echo "Staged production deployment (domain NOT switched): $DEPLOY_URL"
          {
            echo "### Staged Production Candidate (\`--skip-domain\`)"
            echo "- **Commit SHA:** \`$GITHUB_SHA\`"
            echo "- **Candidate URL:** $DEPLOY_URL"
            echo "- **Live Domain Switched:** No (\`--skip-domain\`)"
            echo ""
            echo "#### Release Cutover Checklist"
            echo "1. Apply & verify DB migrations for \`$GITHUB_SHA\`."
            echo "2. Smoke-test auth, contracts, archive RLS, and staged R2 upload on \`$DEPLOY_URL\`."
            echo "3. Trigger **Actions → CI → Run workflow** on \`main\` with \`promote_deployment_url=$DEPLOY_URL\` to switch the live domain."
          } >> "$GITHUB_STEP_SUMMARY"

  promote-production:
    name: promote verified deployment to production domain
    runs-on: ubuntu-latest
    needs: [deploy-guard]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.promote_deployment_url != ''
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Verify Vercel credentials and promote deployment URL
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROMOTE_URL: ${{ inputs.promote_deployment_url }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Missing VERCEL_TOKEN, VERCEL_ORG_ID, or VERCEL_PROJECT_ID in GitHub repository secrets."
            exit 1
          fi
          if [[ ! "$PROMOTE_URL" =~ ^https://[a-z0-9-]+\.vercel\.app$ ]]; then
            echo "::error::promote_deployment_url must match ^https://[a-z0-9-]+\\.vercel\\.app$"
            exit 1
          fi
          npx --yes vercel@latest promote "$PROMOTE_URL" --yes --token="$VERCEL_TOKEN"
          {
            echo "### Production Domain Promotion Complete"
            echo "- **Workflow SHA:** \`$GITHUB_SHA\`"
            echo "- **Promoted Deployment:** $PROMOTE_URL"
            echo "- **Rollback:** Re-run **CI → Run workflow** on \`main\` with \`promote_deployment_url\` set to the previous verified \`https://*.vercel.app\` URL."
          } >> "$GITHUB_STEP_SUMMARY"
