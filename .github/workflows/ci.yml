name: CI

on:
  push:
    branches: [main, codex/fix-review-20261031]
    paths-ignore: ["docs/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: lint · typecheck · audit · database · build · unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          TZ: UTC
      - name: Vietnam calendar under a second server time zone
        run: pnpm exec vitest run --project unit tests/unit/business-date.test.ts tests/unit/format.test.ts tests/unit/contracts-query.test.ts
        env:
          TZ: America/Los_Angeles
      - name: Reject all reported production vulnerabilities
        run: pnpm audit --prod --audit-level=low
      - run: pnpm test:db
      - name: Build with placeholders
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_placeholder
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_placeholder
          R2_ACCOUNT_ID: placeholder
          R2_ACCESS_KEY_ID: placeholder
          R2_SECRET_ACCESS_KEY: placeholder
          R2_BUCKET_NAME: placeholder
          R2_ENDPOINT: https://placeholder.r2.cloudflarestorage.com

  integration:
    name: integration (isolated Auth · RLS · storage · audit)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/start-isolated-backend
      - run: pnpm test:integration
      - name: Remove disposable backend and credentials
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then supabase stop --workdir tests/setup --no-backup; fi
          rm -f .env.test.local test-results/backend-status.json

  e2e:
    name: e2e (isolated browser workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: [quality, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: ./.github/actions/start-isolated-backend
      - run: pnpm test:e2e
      - name: Remove disposable backend and credentials
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then supabase stop --workdir tests/setup --no-backup; fi
          rm -f .env.test.local test-results/backend-status.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/playwright/
          retention-days: 7

  deploy-guard:
    name: deployment guard (all gates green)
    runs-on: ubuntu-latest
    needs: [quality, integration, e2e]
    if: always()
    steps:
      - name: Verify all quality gates, including fork runs
        run: |
          [ "${{ needs.quality.result }}" = "success" ] && \
          [ "${{ needs.integration.result }}" = "success" ] && \
          [ "${{ needs.e2e.result }}" = "success" ] || exit 1
          echo "All isolated quality gates passed."
